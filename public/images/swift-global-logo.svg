    <text x="194" y="96" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" letter-spacing="0.20em" fill="#D4AF37">GLOBAL INC.</text>
